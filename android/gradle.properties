# Gradle
org.gradle.jvmargs=-Xmx4g -XX\:MaxMetaspaceSize=1g -XX\:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# JDK: намеренно НЕ задаём org.gradle.java.home в этом файле.
#  1. Android Studio подставляет свой JBR автоматически.
#  2. Для сборки из командной строки используйте scripts/gradlew.sh —
#     он сам находит подходящий JDK 17+.
#  3. Либо задайте путь в ~/.gradle/gradle.properties: пользовательский
#     файл имеет приоритет над проектным.
# Причина: путь к JDK зависит от машины, и хранить его в коммитируемом
# файле значит ломать сборку у всех остальных.

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.useKSP2=true
