openapi: 3.1.0

info:
  title: Mango Messenger API
  version: 0.1.0-draft
  description: |
    API мессенджера Mango с интегрированным управлением задачами.

    **Статус: черновик контракта (Этап 1).** Реализация — Этап 3–6.
    Документ описывает согласованный контракт, по которому строится клиент;
    расхождения между этим файлом и реализацией будут проверяться
    контрактным тестом.

    ## Идемпотентность

    Все модифицирующие запросы принимают заголовок `Idempotency-Key`
    со значением `clientOpId` (UUIDv7), сгенерированным на устройстве
    до отправки. Повторный запрос с тем же ключом возвращает **ранее
    сохранённый результат**, а не применяет операцию заново.

    Это не опция: клиент повторяет операции при неизвестном исходе
    (таймаут, обрыв, убийство процесса), и без ключа идемпотентности
    это порождало бы дубликаты сообщений.

    ## Синхронизация

    WebSocket — транспорт ускорения, а не источник истины. После каждого
    подключения клиент обязан сверяться через `GET /v1/sync`.
    См. `docs/architecture/sync-model.md`.

servers:
  - url: http://localhost:8080
    description: Локальная разработка
  - url: https://api.mango.example
    description: Промышленная среда (ещё не развёрнута)

tags:
  - name: auth
  - name: users
  - name: conversations
  - name: messages
  - name: tasks
  - name: attachments
  - name: sync
  - name: notifications

security:
  - bearerAuth: []

paths:

  # ─────────────────────────── auth ───────────────────────────

  /v1/auth/register:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Регистрация по email
      description: |
        Ответ НЕ зависит от того, свободен ли адрес: и для нового, и для
        уже зарегистрированного возвращается `202`. Иначе эндпоинт позволял
        бы проверять по списку, кто пользуется сервисом.

        Владельцу занятого адреса уходит письмо о попытке регистрации —
        так он узнаёт о происходящем, а посторонний не узнаёт ничего.

        Имя пользователя (`username`) — исключение: оно публично и участвует
        в поиске, поэтому о его занятости сообщается прямо через `409`.

        См. ADR-0014.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName, username]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 64 }
                username: { type: string, pattern: '^[A-Za-z0-9_]{3,32}$' }
      responses:
        '202':
          description: |
            Запрос принят. Если адрес был свободен, на него отправлено
            письмо с кодом подтверждения.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '409':
          description: Имя пользователя занято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/verify-email:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Подтверждение email по адресу и коду из письма
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string }
      responses:
        '200': { description: Email подтверждён }
        '400': { description: Токен недействителен или истёк }

  /v1/auth/login:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Выдана пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: |
            Неверные учётные данные. Ответ идентичен для несуществующего
            email и неверного пароля — в том числе по времени выполнения:
            для неизвестного адреса пароль всё равно проверяется против
            эталонного хеша.
        '403':
          description: |
            Адрес электронной почты не подтверждён.

            Проверка выполняется ПОСЛЕ проверки пароля, поэтому этот ответ
            не сообщает о существовании учётной записи тому, кто пароля
            не знает.
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/refresh:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Обновление access token с ротацией refresh token
      description: |
        Refresh token **ротируется**: старый становится недействительным.
        Повторное использование уже использованного refresh token
        трактуется как компрометация — все сессии пользователя отзываются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
          description: Новая пара токенов
        '401': { description: Токен недействителен; требуется повторный вход }

  /v1/auth/logout:
    post:
      x-implemented: true
      tags: [auth]
      summary: Выход из текущей сессии
      responses:
        '204': { description: Сессия отозвана }

  /v1/auth/password/forgot:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Запрос восстановления доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: |
            Если адрес зарегистрирован, письмо отправлено. Ответ
            одинаков в любом случае — иначе эндпоинт перечисляет адреса.

  /v1/auth/password/reset:
    post:
      x-implemented: true
      tags: [auth]
      security: []
      summary: Установка нового пароля по токену
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        '200': { description: Пароль изменён, все сессии отозваны }
        '400': { description: Токен недействителен или истёк }

  /v1/auth/sessions:
    get:
      x-implemented: true
      tags: [auth]
      summary: Активные сессии и устройства
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
          description: Список сессий

  /v1/auth/sessions/{sessionId}:
    delete:
      x-implemented: true
      tags: [auth]
      summary: Отзыв сессии
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Сессия отозвана }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── users ───────────────────────────

  /v1/users/me:
    get:
      x-implemented: true
      tags: [users]
      summary: Профиль текущего пользователя
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
          description: Профиль
    patch:
      tags: [users]
      summary: Изменение профиля
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 64 }
                username: { type: string, pattern: '^[a-zA-Z0-9_]{3,32}$' }
                bio: { type: string, maxLength: 280 }
                privacy: { $ref: '#/components/schemas/PrivacySettings' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
          description: Обновлённый профиль
        '409': { description: username занят }

  /v1/users/search:
    get:
      x-implemented: true
      tags: [users]
      summary: Поиск пользователей
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
          description: Найденные пользователи

  /v1/users/me/devices/push:
    put:
      x-implemented: true
      tags: [users]
      summary: Регистрация push-токена устройства
      description: |
        Токен привязывается к устройству текущей сессии (устройство заводится
        при входе со сведениями `device`). Тот же токен у другого устройства
        снимается — телефон мог перейти к другому человеку. Push уходят
        только на устройства с живой сессией и содержат лишь идентификаторы
        (ADR-0010): `{type: message, conversationId, messageId}` либо
        `{type: task_reminder, taskId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { type: string, enum: [FCM] }
                token: { type: string, maxLength: 4096 }
      responses:
        '204': { description: Токен сохранён }
        '409': { description: Сессия не связана с устройством — нужен вход со сведениями об устройстве }
    delete:
      x-implemented: true
      tags: [users]
      summary: Отказ от push на этом устройстве
      description: Вызывается при выходе, до завершения сессии.
      responses:
        '204': { description: Токен снят }

  # ───────────────────── conversations ─────────────────────

  /v1/conversations:
    get:
      x-implemented: true
      tags: [conversations]
      summary: Список чатов
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  nextCursor: { type: string, nullable: true }
          description: Страница списка чатов
    post:
      x-implemented: true
      tags: [conversations]
      summary: Создание чата
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, memberIds]
              properties:
                type: { type: string, enum: [DIRECT, GROUP] }
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
                title: { type: string, maxLength: 128 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
          description: |
            Чат создан или уже существовал. Для DIRECT при существующем
            чате возвращается существующий — повторное открытие переписки
            не должно создавать второй личный чат, поэтому код один и тот же.
            Событие `CONVERSATION_CREATED` каждый участник получает со своей
            карточкой: заголовок личного чата и роль у каждого свои.

  /v1/conversations/{conversationId}:
    patch:
      x-implemented: true
      tags: [conversations]
      summary: Переименование группы
      description: |
        Администратор или владелец. В историю добавляется системное
        сообщение `TITLE_CHANGED`, участники получают `CONVERSATION_UPDATED`.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
          description: Карточка чата после изменения
        '400': { description: Чат не групповой }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/conversations/{conversationId}/members:
    get:
      x-implemented: true
      tags: [conversations]
      summary: Участники чата
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
          description: Действующие участники
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      x-implemented: true
      tags: [conversations]
      summary: Добавление участников
      description: |
        Администратор или владелец, только в группе. Уже состоящие
        в группе пропускаются — повтор запроса безопасен и не порождает
        второго системного сообщения. Новые участники получают
        `CONVERSATION_CREATED`, остальные — `CONVERSATION_MEMBER_ADDED`.
        История группы новым участникам видна целиком.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 200
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
          description: Состав после изменения
        '400': { description: Чат не групповой }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Пользователи не найдены или превышен предел участников (201) }

  /v1/conversations/{conversationId}/members/{userId}:
    delete:
      x-implemented: true
      tags: [conversations]
      summary: Удаление участника или выход из группы
      description: |
        Свой `userId` — выход, доступен любому участнику. Чужой: владелец
        удаляет любого, администратор — только рядового участника.
        Если уходит владелец, владение переходит самому давнему
        администратору, а при их отсутствии — самому давнему участнику.
        Ушёл последний — группа удаляется.

        Выбывший получает `CONVERSATION_MEMBER_REMOVED` и теряет доступ
        к истории, файлам и задачам группы. Повтор удаления — 204.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Участник удалён (или уже не состоял) }
        '400': { description: Чат не групповой }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/conversations/{conversationId}/members/{userId}/role:
    put:
      x-implemented: true
      tags: [conversations]
      summary: Смена роли участника
      description: |
        Только владелец. Роль `OWNER` — передача владения: прежний
        владелец становится администратором.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
          description: Участник с новой ролью
        '400': { description: Чат не групповой или попытка сменить свою роль }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/conversations/{conversationId}/read:
    put:
      x-implemented: true
      tags: [conversations]
      summary: Отметка о прочтении
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int64 }
      responses:
        '204':
          description: |
            Отметка применена. Значение только возрастает: запоздавший
            запрос с меньшим seq игнорируется.

  # ─────────────────────── messages ───────────────────────

  /v1/conversations/{conversationId}/messages:
    get:
      x-implemented: true
      tags: [messages]
      summary: История сообщений
      description: |
        Пагинация по `seq`, без OFFSET. `beforeSeq` — страница назад
        (основной режим), `afterSeq` — догрузка разрыва вперёд.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: beforeSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: afterSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
          description: Страница истории
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      x-implemented: true
      tags: [messages]
      summary: Отправка сообщения
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientMsgId, type]
              properties:
                clientMsgId:
                  type: string
                  description: UUIDv7, сгенерированный клиентом. Ключ дедупликации.
                type: { type: string, enum: [TEXT, IMAGE, VIDEO, VOICE, FILE] }
                body: { type: string, maxLength: 8192 }
                replyToId: { type: string, format: uuid, nullable: true }
                attachmentIds:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                  description: |
                    Загруженные вызывающим для этого чата и прошедшие проверку
                    вложения. Обязательны для IMAGE/VIDEO/VOICE/FILE, запрещены
                    для TEXT. Привязываются в той же транзакции; не привязалось
                    хоть одно — 422, сообщение не создаётся.
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
          description: |
            Сообщение сохранено и получило `seq`. При повторе с тем же
            `clientMsgId` возвращается уже созданное сообщение со статусом 200.
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
          description: Операция уже была применена ранее (идемпотентный повтор)
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/messages/{messageId}:
    patch:
      x-implemented: true
      tags: [messages]
      summary: Редактирование сообщения
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 8192 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
          description: Сообщение изменено
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      x-implemented: true
      tags: [messages]
      summary: Удаление сообщения
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: forEveryone, in: query, schema: { type: boolean, default: false } }
      responses:
        '204':
          description: |
            Сообщение помечено удалённым. Строка сохраняется: на неё могут
            ссылаться ответы и задачи. Задачи, созданные из этого сообщения,
            получают признак недоступности источника, но сохраняют снапшот текста.

  /v1/messages/{messageId}/reactions:
    put:
