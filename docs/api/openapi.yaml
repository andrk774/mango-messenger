                    items: { $ref: '#/components/schemas/Notification' }
                  nextCursor: { type: string, nullable: true }
          description: Страница уведомлений

  /v1/health:
    get:
      x-implemented: true
      tags: [sync]
      security: []
      summary: Проверка живости
      responses:
        '200': { description: Сервис отвечает }

  /v1/health/ready:
    get:
      x-implemented: true
      tags: [sync]
      security: []
      summary: Готовность принимать трафик
      responses:
        '200': { description: БД и Redis доступны }
        '503': { description: Зависимости недоступны }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        clientOpId (UUIDv7), сгенерированный устройством ДО отправки.
        Повтор с тем же ключом возвращает ранее сохранённый результат.

  responses:
    Forbidden:
      description: |
        Нет прав на операцию. Возвращается в том числе когда объект
        существует, но пользователь не является участником чата —
        ответ не отличается от «не найдено», чтобы не раскрывать
        существование чужих объектов.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Данные не прошли валидацию
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema: { type: integer }
          description: Через сколько секунд повторять. Приоритетнее клиентской формулы backoff.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Accepted:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FORBIDDEN }
        message: { type: string }
        traceId: { type: string, description: Для корреляции с логами сервера }

    DeviceInfo:
      type: object
      required: [platform, model, appVersion]
      properties:
        platform: { type: string, enum: [ANDROID, IOS, WEB] }
        model: { type: string }
        appVersion: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        lastActiveAt: { type: string, format: date-time }
        isCurrent: { type: boolean }

    User:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        presence: { type: string, enum: [ONLINE, OFFLINE, AWAY, DO_NOT_DISTURB] }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            privacy: { $ref: '#/components/schemas/PrivacySettings' }

    PrivacySettings:
      type: object
      properties:
        lastSeenVisibility: { type: string, enum: [EVERYONE, CONTACTS, NOBODY] }
        avatarVisibility: { type: string, enum: [EVERYONE, CONTACTS, NOBODY] }
        readReceiptsEnabled: { type: boolean }
        typingIndicatorEnabled: { type: boolean }

    Conversation:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DIRECT, GROUP] }
        title: { type: string }
        avatarUrl: { type: string, nullable: true }
        memberCount: { type: integer }
        myRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        lastEventSeq: { type: integer, format: int64 }
        lastReadSeq: { type: integer, format: int64 }
        unreadCount: { type: integer }
        mutedUntil: { type: string, format: date-time, nullable: true }
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'

    Message:
      type: object
      required: [id, conversationId, senderId, clientMsgId, seq, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        clientMsgId: { type: string }
        seq:
          type: integer
          format: int64
          description: Порядковый номер внутри чата. Источник истины для порядка.
        type: { type: string, enum: [TEXT, IMAGE, VIDEO, VOICE, FILE, SYSTEM] }
        body: { type: string, nullable: true }
        replyTo:
          oneOf:
            - $ref: '#/components/schemas/MessageReference'
            - type: 'null'
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        system:
          oneOf:
            - $ref: '#/components/schemas/SystemEvent'
            - type: 'null'
          description: Только для `type = SYSTEM`; `body` у таких сообщений пуст.
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji: { type: string }
              userId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        pinnedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    MessageReference:
      type: object
      description: |
        Содержит снапшот автора и текста: исходное сообщение может быть
        удалено, и тогда ответ всё равно должен остаться читаемым.
      properties:
        messageId: { type: string, format: uuid }
        senderName: { type: string }
        textSnapshot: { type: string, nullable: true }
        isUnavailable: { type: boolean }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        fileName: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }

    Member:
      type: object
      required: [userId, username, displayName, role, joinedAt, lastReadSeq]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        joinedAt: { type: string, format: date-time }
        lastReadSeq: { type: integer, format: int64 }

    UploadTicket:
      type: object
      required: [attachmentId, uploadUrl, expiresAt, uploaded]
      properties:
        attachmentId: { type: string, format: uuid }
        uploadUrl:
          type: string
          description: Для PUT; относительная (от адреса API) или абсолютная.
        expiresAt: { type: string, format: date-time }
        uploaded: { type: boolean, description: Файл уже принят — загружать не нужно }

    SystemEvent:
      type: object
      required: [kind, actorId, actorName]
      description: |
        Структура системного сообщения. Текст собирает клиент на языке
        интерфейса — сервер не знает ни языка, ни грамматического рода.
      properties:
        kind:
          type: string
          enum: [MEMBERS_ADDED, MEMBER_REMOVED, MEMBER_LEFT, TITLE_CHANGED, ROLE_CHANGED, OWNER_CHANGED]
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        targets:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              name: { type: string }
        title: { type: string, nullable: true, description: Для TITLE_CHANGED }
        role:
          type: string
          nullable: true
          description: Для ROLE_CHANGED/OWNER_CHANGED; у MEMBER_LEFT — OWNER, если владение перешло

    CreateTaskRequest:
      type: object
      required: [taskId, title]
      properties:
        taskId: { type: string, format: uuid, description: UUIDv7 от клиента }
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 8192 }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        dueAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
        conversationId: { type: string, format: uuid, nullable: true }
        parentTaskId: { type: string, format: uuid, nullable: true }
        assigneeIds:
          type: array
          items: { type: string, format: uuid }

    Task:
      type: object
      required: [id, title, status, priority, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [TODO, IN_PROGRESS, REVIEW, DONE, CANCELLED] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        createdBy: { type: string, format: uuid }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/TaskAssignee' }
        conversationId: { type: string, format: uuid, nullable: true }
        conversationTitle: { type: string, nullable: true }
        source:
          oneOf:
            - $ref: '#/components/schemas/TaskSource'
            - type: 'null'
        parentTaskId: { type: string, format: uuid, nullable: true }
        subtaskCount: { type: integer }
        completedSubtaskCount: { type: integer }
        commentCount: { type: integer }
        dueAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
        version:
          type: integer
          format: int64
          description: Передаётся обратно как baseVersion при PATCH
        fieldVersions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Метка последнего принятого изменения по каждому полю, epoch millis
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskSource:
      type: object
      description: |
        Связь с исходным сообщением. Снапшот текста сохраняется навсегда:
        удаление сообщения выставляет isSourceUnavailable, но не стирает текст.
      properties:
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderName: { type: string }
        textSnapshot: { type: string, nullable: true }
        sourceCreatedAt: { type: string, format: date-time, nullable: true }
        isSourceUnavailable: { type: boolean }

    TaskAssignee:
      type: object
      required: [userId, username, displayName]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }

    TaskComment:
      type: object
      required: [id, taskId, authorId, clientOpId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        clientOpId: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }

    TaskEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskId: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        type:
          type: string
          enum: [CREATED, STATUS_CHANGED, PRIORITY_CHANGED, ASSIGNED, UNASSIGNED,
                 DUE_DATE_CHANGED, REMINDER_CHANGED, TITLE_CHANGED, DESCRIPTION_CHANGED,
                 FIELD_CHANGED, EDIT_REJECTED, COMMENT_ADDED, DELETED]
          description: |
            `EDIT_REJECTED` — правка, проигравшая при разрешении конфликта;
            в `newValue` — отклонённое значение.
        actorName: { type: string, nullable: true }
        field: { type: string, nullable: true }
        oldValue: { nullable: true }
        newValue: { nullable: true }
        createdAt: { type: string, format: date-time }

    SyncEvent:
      type: object
      required: [id, type, scope]
      properties:
        id:
          type: integer
          format: int64
          description: Монотонно возрастает в пределах пользователя. Основа курсора.
        type: { type: string, example: MESSAGE_CREATED }
        scope: { type: string, enum: [CONVERSATION, TASK, PROFILE] }
        scopeId: { type: string, format: uuid, nullable: true }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [NEW_MESSAGE, MENTION, TASK_ASSIGNED, TASK_UPDATED,
                 TASK_COMMENT, TASK_REMINDER, CONVERSATION_EVENT]
        title: { type: string }
        body: { type: string, nullable: true }
        conversationId: { type: string, format: uuid, nullable: true }
        taskId: { type: string, format: uuid, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
