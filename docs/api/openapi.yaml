  # ─────────────────────── attachments ───────────────────────

  /v1/attachments/upload-ticket:
    post:
      x-implemented: true
      tags: [attachments]
      summary: Разрешение на загрузку файла
      description: |
        Клиент заявляет тип, размер и SHA-256 файла. Тип проверяется по
        белому списку, размер — по пределам (картинки 20 МБ, прочее 100 МБ),
        вызывающий должен состоять в чате. Ответ — ссылка для PUT,
        действительная 15 минут.

        Идемпотентность — по `attachmentId`: повтор с теми же данными
        возвращает 200 и новое разрешение; `uploaded: true` означает,
        что файл уже принят. Не более 50 непривязанных разрешений
        за сутки на пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentId, conversationId, mimeType, sizeBytes, checksumSha256]
              properties:
                attachmentId: { type: string, format: uuid }
                conversationId: { type: string, format: uuid }
                mimeType:
                  type: string
                  description: |
                    image/jpeg, image/png, image/gif, image/webp, image/heic,
                    video/mp4, video/webm, audio/ogg, audio/mpeg, audio/mp4,
                    audio/aac, audio/webm, application/pdf, application/zip,
                    документы Office (OOXML), text/plain.
                sizeBytes: { type: integer, format: int64, minimum: 1 }
                checksumSha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
                fileName: { type: string, maxLength: 255 }
                width: { type: integer, nullable: true }
                height: { type: integer, nullable: true }
                durationMs: { type: integer, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
          description: Разрешение выдано
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
          description: Повтор — разрешение для уже заявленного файла
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Идентификатор уже использован для другого файла, или файл отклонён }
        '413': { description: Превышен допустимый размер }
        '415': { description: Недопустимый тип файла }
        '429': { description: Слишком много непривязанных разрешений }

  /v1/attachments/{attachmentId}/content:
    put:
      x-implemented: true
      tags: [attachments]
      summary: Загрузка содержимого по подписанной ссылке
      description: |
        Вызывается по `uploadUrl` из разрешения; аутентификация — подписью
        в ссылке, токен не нужен. Сервер принимает не больше заявленного
        размера, сверяет размер и SHA-256, затем сигнатуру содержимого
        с заявленным типом.

        Несовпадение размера или хеша — 400, разрешение остаётся
        действительным (повтор). Несовпадение типа — 415, файл отклонён
        окончательно. Повтор уже принятого файла — 204.
      security: []
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Файл принят }
        '400': { description: Размер или контрольная сумма не совпали }
        '403': { description: Ссылка недействительна или истекла }
        '409': { description: Файл ранее отклонён проверкой }
        '413': { description: Больше заявленного размера }
        '415': { description: Содержимое не соответствует заявленному типу }
    get:
      x-implemented: true
      tags: [attachments]
      summary: Скачивание по подписанной ссылке
      description: |
        Вызывается по `url` из `/url`. Картинки отдаются с
        `Content-Disposition: inline`, остальное — `attachment`.
        Всегда добавляется `Content-Security-Policy: sandbox`.
      security: []
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Содержимое файла
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { description: Ссылка недействительна, истекла или файл недоступен }

  /v1/attachments/{attachmentId}/url:
    get:
      x-implemented: true
      tags: [attachments]
      summary: Временная ссылка на скачивание
      description: |
        Права проверяются здесь: автор видит свой файл всегда, остальные —
        только если файл в неудалённом сообщении чата, где они состоят
        сейчас. Ссылка живёт 5 минут; может быть относительной (от адреса
        API) или абсолютной.
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
                  mimeType: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  fileName: { type: string }
          description: Временная ссылка
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Файл ещё не загружен или не прошёл проверку }

  # ───────────────────────── sync ─────────────────────────

  /v1/sync:
    get:
      x-implemented: true
      tags: [sync]
      summary: Догонка пропущенных событий
      description: |
        Основной механизм надёжности. Вызывается после каждого
        переподключения WebSocket, а также при обнаружении разрыва
        в нумерации событий.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Последний применённый eventId
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/SyncEvent' }
                  lastEventId: { type: integer, format: int64 }
                  hasMore: { type: boolean }
          description: Страница событий
        '410':
          description: |
            Курсор устарел — журнал усечён. Клиент обязан перезагрузить
            указанные области (`scopes`), но НЕ всю базу целиком.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetScopes:
                    type: array
                    items: { type: string }

  /v1/sync/bootstrap:
    get:
      x-implemented: true
      tags: [sync]
      summary: Первичная загрузка после входа
      responses:
        '200':
          description: Чаты, участники и последние сообщения каждого чата
          content:
