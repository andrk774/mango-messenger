        его участники.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
          description: Задача создана
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
          description: Повтор — задача уже существует
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/tasks/{taskId}:
    get:
      tags: [tasks]
      summary: Задача
      x-implemented: true
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
          description: Задача
        '403':
          description: Задача не найдена, удалена или не видна вызывающему — ответы намеренно одинаковы
    patch:
      tags: [tasks]
      summary: Частичное изменение задачи с разрешением конфликтов
      x-implemented: true
      description: |
        Отправляются **только изменённые поля** вместе с `baseVersion`
        и метками времени изменения по каждому полю.

        - `baseVersion == version` — клиент видел актуальное состояние,
          изменения применяются как есть.
        - `baseVersion < version` — сервер сравнивает метки по каждому полю
          (LWW); метки из будущего ограничиваются временем сервера,
          при равенстве статусов побеждает более «завершённый».
          Проигравшие поля перечисляются в `conflicts` и записываются
          в историю как `EDIT_REJECTED`.

        Ответ — итоговое состояние; клиент принимает его как истину.
        Подробности: ADR-0005 и `docs/architecture/sync-model.md`.
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, changedFields]
              properties:
                baseVersion: { type: integer, format: int64 }
                changedFields:
                  type: object
                  description: |
                    Ключи: title, description, status, priority, due_at, remind_at.
                    Значения — строки (даты в ISO-8601) или null для очистки.
                  additionalProperties: { type: string, nullable: true }
                  example: { status: DONE, priority: HIGH }
                fieldTimestamps:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                  description: Метки времени локального изменения по полям, epoch millis
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [task, conflicts]
                properties:
                  task: { $ref: '#/components/schemas/Task' }
                  conflicts:
                    type: array
                    items: { type: string }
                    description: Поля, где правка проиграла
          description: Актуальное состояние задачи
        '403':
          description: Задача не найдена, удалена или не видна вызывающему
    delete:
      tags: [tasks]
      summary: Удаление задачи
      x-implemented: true
      description: Мягкое удаление; доступно только создателю.
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Удалена; повтор автором тоже даёт 204 без нового события }
        '403':
          description: Вызывающий не автор, или задача не найдена / не видна

  /v1/tasks/{taskId}/assignees:
    post:
      tags: [tasks]
      summary: Изменение набора исполнителей
      x-implemented: true
      description: |
        Передаются списки добавления и удаления, а не итоговый набор,
        поэтому два устройства, назначившие разных людей, не затирают
        друг друга. Для одного и того же человека побеждает операция,
        пришедшая на сервер позже (метки назначения и снятия строго
        возрастают). Подробности — ADR-0005.
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
