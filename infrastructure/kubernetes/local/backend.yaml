apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mango-attachments
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: mango-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mango-backend
  template:
    metadata:
      labels:
        app: mango-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: mango-backend
          imagePullPolicy: IfNotPresent
          env:
            - name: MANGO_SMTP_KEY_FILE
              value: /run/secrets/smtp/smtp-encryption.key
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mango-config
            - secretRef:
                name: mango-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: smtp-key
              mountPath: /run/secrets/smtp
              readOnly: true
            - name: attachments
              mountPath: /data/attachments
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: smtp-key
          secret:
            secretName: mango-smtp-key
            defaultMode: 0440
        - name: attachments
          persistentVolumeClaim:
            claimName: mango-attachments
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
