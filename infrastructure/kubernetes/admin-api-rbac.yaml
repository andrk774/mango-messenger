# Apply explicitly to the intended cluster. This account cannot modify resources,
# read Secrets, execute commands in pods, or access application logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mango-panel-reader
  namespace: mango-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mango-panel-reader
  namespace: mango-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["backend"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["backend"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mango-panel-reader
  namespace: mango-dev
subjects:
  - kind: ServiceAccount
    name: mango-panel-reader
    namespace: mango-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mango-panel-reader
