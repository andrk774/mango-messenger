# Optional media service. Prepare secrets/calls/livekit.yaml and backend.env first.
# Merge with docker-compose.yml. Public clients need a trusted WSS endpoint and reachable media ports.
services:
  backend:
    env_file:
      - ../../secrets/calls/backend.env
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../../secrets/calls/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped
